[project]
name = "giveaway-support-bot"
version = "0.1.0"
description = "GRAM Support Telegram bot"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "aiogram>=3.31.0",
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "python-dotenv>=1.2.4",
    "sqlalchemy[asyncio]>=2.1.6",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
source-include = ["alembic.ini", "migrations/**"]
